name: Build and Push Docker Image

on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
    # Only rebuild when the image itself changes (not evaluated for tag pushes)
    paths:
      - "docker/**"
      - ".github/workflows/docker-publish.yml"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # latest and sha-<commit> come from main; <version> from a vX.Y.Z tag.
      # A tag run does not publish sha-<commit>, so it cannot overwrite the main build.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/docker-vpn
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A release tag is published once: rebuilding it would change an image that
      # compose files already pin
      - name: Refuse to overwrite a release
        if: github.ref_type == 'tag'
        env:
          RELEASE: ${{ secrets.DOCKERHUB_USERNAME }}/docker-vpn:${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$RELEASE" > /dev/null 2>&1; then
            echo "::error::$RELEASE already exists and is not overwritten. Publish a new version instead."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: Build and Push Docker Image

on:
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"
    # Ricostruisce solo se cambia l'immagine (non vale per i push di tag)
    paths:
      - "docker/**"
      - ".github/workflows/docker-publish.yml"

jobs:
  # Il server di server-setup usa l'immagine "latest": uno script rotto pubblicato lì
  # sostituirebbe il container funzionante con uno che si ferma all'avvio (e con
  # restart: unless-stopped lo riavvia in continuazione). Si pubblica solo se questo passa.
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sintassi e shellcheck
        run: |
          for f in docker/*.sh tests/*.sh; do bash -n "$f"; done
          shellcheck -x -P SCRIPTDIR docker/*.sh tests/*.sh

      # Un'inizializzazione completa, un client che si connette e la revoca: bastano
      # a vedere un avvio rotto. La suite intera (tests/run.sh) si lancia a mano.
      - name: Prove end-to-end
        run: tests/run.sh t_manage t_revoke

  docker:
    needs: verifica
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # latest e sha-<commit> vengono da main, <version> da un tag vX.Y.Z.
      # Un tag non pubblica sha-<commit>, quindi non può sovrascrivere la build di main.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/docker-vpn
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Una release si pubblica una volta sola: ricostruirla cambierebbe un'immagine
      # che i file compose hanno già fissato
      - name: Rifiuta di sovrascrivere una release
        if: github.ref_type == 'tag'
        env:
          RELEASE: ${{ secrets.DOCKERHUB_USERNAME }}/docker-vpn:${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$RELEASE" > /dev/null 2>&1; then
            echo "::error::$RELEASE esiste già e non viene sovrascritta. Pubblica una nuova versione."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

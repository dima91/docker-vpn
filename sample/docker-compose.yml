# Impostazioni comuni a tutti i servizi VPN.
# VPN_IMAGE (nel file .env) sostituisce l'immagine, ad esempio con quella di un fork.
# Se l'immagine non si può scaricare viene costruita dai sorgenti in ../docker.
x-vpn: &vpn
  image: ${VPN_IMAGE:-dockerdima/docker-vpn:1.0.0}
  build: ../docker
  cap_add:
    - NET_ADMIN
  sysctls:
    - net.ipv4.ip_forward=1
  devices:
    - /dev/net/tun:/dev/net/tun
  restart: unless-stopped

services:
  vpn-personal:
    <<: *vpn
    container_name: vpn-personal
    ports:
      - "1194:1194/${VPN_PROTO:-udp}"
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-}
      - VPN_PROTO=${VPN_PROTO:-udp}
      - VPN_PORT=1194
      - VPN_SUBNET=10.8.0.0
    volumes:
      - ./data/personal:/etc/openvpn


  vpn-work:
    <<: *vpn
    container_name: vpn-work
    ports:
      - "1195:1195/${VPN_PROTO:-udp}"
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-}
      - VPN_PROTO=${VPN_PROTO:-udp}
      - VPN_PORT=1195
      - VPN_SUBNET=10.8.10.0
    volumes:
      - ./data/work:/etc/openvpn
